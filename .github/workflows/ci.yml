name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Shell syntax of vendored scripts
        run: for f in data/libexec/*.sh data/plugins/*.sh data/scripts/*.sh; do sh -n "$f"; done
      - name: Install into staging dir
        run: |
          sudo apt-get install -y scdoc
          make install DESTDIR="$PWD/stage" EXTRAS=all MAN_PAGES=1
          find stage -type f -o -type l | sort
